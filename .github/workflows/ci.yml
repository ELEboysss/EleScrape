name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Show runtime
        run: node --version

      - name: Unit tests
        run: npm test

      - name: Module load check
        run: node scripts/check-syntax.js

      - name: CLI smoke test
        run: |
          node bin/elescrape.js --version
          node bin/elescrape.js --help
          node bin/elescrape.js help capture
